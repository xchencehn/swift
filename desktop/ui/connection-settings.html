<button id="connectionBack" class="connection-back" type="button" hidden>返回会话</button>
<section aria-labelledby="savedHeading" id="savedSection" hidden>
  <h2 id="savedHeading">已保存的服务器</h2>
  <div id="profiles"></div>
</section>
<section>
  <button id="addServer" type="button" aria-haspopup="dialog" aria-controls="addServerDialog">
    添加服务器
  </button>
  <p id="serverListStatus" role="status" aria-live="polite"></p>
  <dialog id="addServerDialog" class="server-dialog" aria-labelledby="addServerTitle">
    <div class="server-dialog-heading">
      <h2 id="addServerTitle">添加服务器</h2>
      <button id="closeAddServer" type="button" aria-label="关闭添加服务器" title="关闭">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
    <form id="connectionForm">
      <label for="name">服务器名称（可选）</label
      ><input id="name" maxlength="80" placeholder="例如：我的电脑" />
      <fieldset>
        <legend>连接方式</legend>
        <label><input type="radio" name="mode" value="local" checked />同一系统</label
        ><label><input type="radio" name="mode" value="wsl" />Windows / WSL</label
        ><label><input type="radio" name="mode" value="lan" />局域网</label>
      </fieldset>
      <div id="directFields">
        <label for="address">服务器连接链接</label
        ><input
          id="address"
          type="url"
          value="http://127.0.0.1:8792/swift/"
          spellcheck="false"
          autocomplete="off"
          required
        />
        <p id="connectionHint" class="hint">同一系统内直接连接，无需认证。</p>
      </div>
      <input id="token" type="hidden" value="" />
      <div id="editServerRootFields" hidden>
        <label for="editServerRoot">根目录</label
        ><input id="editServerRoot" type="text" autocomplete="off" spellcheck="false" />
        <div class="server-root-actions">
          <button id="editServerRootBrowse" type="button">选择目录</button
          ><button id="retryServerRoot" type="button" hidden>重新读取</button>
        </div>
        <p id="editServerRootStatus" class="hint" role="status"></p>
      </div>
      <div id="editServerUpdates" hidden></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="server-dialog-actions">
        <button id="cancelAddServer" type="button">取消</button
        ><button id="connectButton" type="submit">添加并连接</button>
      </div>
    </form>
  </dialog>
</section>
