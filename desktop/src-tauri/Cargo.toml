[package]
name = "swift-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "swift-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
swift-desktop-core = { path = "../core" }
tauri = { version = "=2.12.3", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "zip"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
futures-util = "0.3"
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
